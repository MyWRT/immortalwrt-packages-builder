name: Recover usign key (encrypted, one-time)

on:
  workflow_dispatch:

permissions: {}

jobs:
  recover:
    if: >-
      github.actor == 'etnperlong' &&
      github.triggering_actor == 'etnperlong' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Install encryption tool
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends age

      - name: Encrypt existing signing key
        shell: bash
        env:
          KEY_BUILD: ${{ secrets.KEY_BUILD }}
          RECIPIENT: age1mutn393gnwgqccml9perx4udqmuap80zujvmg92gydlw3vug8ydsslfeh0
        run: |
          set +x
          set -euo pipefail
          umask 077
          if [[ -z "$KEY_BUILD" ]]; then
            printf '%s\n' 'KEY_BUILD is unavailable' >&2
            exit 1
          fi
          mkdir -m 700 "$RUNNER_TEMP/usign-recovery-fbe508f9"
          printf '%s' "$KEY_BUILD" |
            age --encrypt --recipient "$RECIPIENT" \
              --output "$RUNNER_TEMP/usign-recovery-fbe508f9/key-build.age"
          unset KEY_BUILD

      - name: Upload ciphertext only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: encrypted-usign-fbe508f9
          path: ${{ runner.temp }}/usign-recovery-fbe508f9/key-build.age
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Remove runner ciphertext
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/usign-recovery-fbe508f9/key-build.age"
